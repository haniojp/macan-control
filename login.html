<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1220"><link rel="stylesheet" href="styles.css"><title>ログイン — Macan Control</title></head>
<body><main class="shell"><section class="panel"><h1>Macan Control</h1><p>車両情報を見るには、アプリ用パスワードでログインしてください。</p><form id="loginForm"><label class="full">アプリ用パスワード<input id="loginPassword" type="password" required maxlength="256" autocomplete="current-password"></label><label class="full remember-option"><input id="loginRemember" type="checkbox" checked>この端末でログイン状態を保持する（30日間）</label><button id="loginSubmit" type="submit">ログイン</button></form><p id="loginMessage" role="status"></p><p class="muted">Porscheのパスワードとは別の、Renderに設定したアプリ用パスワードです。共有端末では保持のチェックを外してください。</p></section></main><script src="login.js" defer></script></body></html>
