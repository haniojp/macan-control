services:
  - type: web
    name: macan-control-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app:create_app --factory --host 0.0.0.0 --port $PORT --workers 1 --no-access-log
    healthCheckPath: /healthz
    autoDeployTrigger: "off"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: ALLOWED_ORIGIN
        value: https://haniojp.github.io
      - key: BRIDGE_ACCESS_KEY
        generateValue: true
      - key: PORSCHE_EMAIL
        sync: false
      - key: PORSCHE_PASSWORD
        sync: false
      - key: PORSCHE_VIN
        value: ""

# Optional login mode: manually add APP_LOGIN_PASSWORD and APP_ORIGIN in Render.
# See docs/APP_LOGIN.md. Keep credentials out of this public file.
